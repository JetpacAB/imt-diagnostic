<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JETPAC // IMT DIAGNOSTIC</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --border: #000000;
            --muted: #666666;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; padding: 40px 20px; }
        
        .wrapper { max-width: 1100px; margin: 0 auto; }
        
        header { border-bottom: 3px solid var(--border); padding-bottom: 20px; margin-bottom: 40px; }
        .brand { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1.1; }
        
        .layout { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 850px) { .layout { grid-template-columns: 1.2fr 0.8fr; } }
        
        .pane-inputs { display: flex; flex-direction: column; gap: 24px; }
        .dimension-card { border: 1px solid var(--border); padding: 20px; }
        
        .dim-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        .dim-title { font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; }
        .dim-score { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; background: var(--fg); color: var(--bg); padding: 2px 6px; }
        
        input[type="range"] { -webkit-appearance: none; width: 100%; background: #e0e0e0; height: 2px; outline: none; margin: 15px 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--fg); cursor: pointer; border-radius: 0; border: none; }
        
        .pane-visual { position: sticky; top: 40px; display: flex; flex-direction: column; gap: 24px; height: fit-content; }
        .chart-box { border: 1px solid var(--border); padding: 30px; display: flex; justify-content: center; align-items: center; background: var(--bg); }
        canvas { max-width: 100%; height: auto; display: block; }
        
        .summary-box { border: 3px solid var(--border); padding: 24px; }
        .metric-label { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
        .metric-value { font-size: 4rem; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
        
        .bottleneck-box { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); font-size: 0.9rem; line-height: 1.4; }
        .bottleneck-highlight { font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="brand">JETPAC // SYSTEMS & GOVERNANCE RESEARCH</div>
            <h1>Institutional Maturity Index</h1>
        </header>
        
        <div class="layout">
            <section class="pane-inputs">
                <div class="dimension-card">
                    <div class="dim-header"><span class="dim-title">1. Responsibility</span><span class="dim-score" id="score-resp">3.0</span></div>
                    <input type="range" id="resp" min="1" max="5" step="0.5" value="3.0">
                </div>
                <div class="dimension-card">
                    <div class="dim-header"><span class="dim-title">2. Information Embedding</span><span class="dim-score" id="score-info">3.0</span></div>
                    <input type="range" id="info" min="1" max="5" step="0.5" value="3.0">
                </div>
                <div class="dimension-card">
                    <div class="dim-header"><span class="dim-title">3. Incentives</span><span class="dim-score" id="score-inc">3.0</span></div>
                    <input type="range" id="inc" min="1" max="5" step="0.5" value="3.0">
                </div>
                <div class="dimension-card">
                    <div class="dim-header"><span class="dim-title">4. Adaptation</span><span class="dim-score" id="score-adapt">3.0</span></div>
                    <input type="range" id="adapt" min="1" max="5" step="0.5" value="3.0">
                </div>
                <div class="dimension-card">
                    <div class="dim-header"><span class="dim-title">5. Competence</span><span class="dim-score" id="score-comp">3.0</span></div>
                    <input type="range" id="comp" min="1" max="5" step="0.5" value="3.0">
                </div>
                <div class="dimension-card">
                    <div class="dim-header"><span class="dim-title">6. Temporal Alignment</span><span class="dim-score" id="score-temp">3.0</span></div>
                    <input type="range" id="temp" min="1" max="5" step="0.5" value="3.0">
                </div>
            </section>
            
            <aside class="pane-visual">
                <div class="chart-box">
                    <canvas id="imtRadar" width="400" height="400"></canvas>
                </div>
                <div class="summary-box">
                    <div class="metric-label">Systemic Maturity Index</div>
                    <div class="metric-value" id="indexValue">3.0</div>
                    <div class="bottleneck-box" id="bottleneckOutput">
                        Adjust sliders to evaluate the organizational landscape.
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('imtRadar');
        const ctx = canvas.getContext('2d');
        
        const dimensions = [
            { id: 'resp', label: 'Responsibility' },
            { id: 'info', label: 'Information' },
            { id: 'inc', label: 'Incentives' },
            { id: 'adapt', label: 'Adaptation' },
            { id: 'comp', label: 'Competence' },
            { id: 'temp', label: 'Temporal' }
        ];

        function render() {
            ctx.clearRect(0, 0, 400, 400);
            const cx = 200, cy = 200, maxRadius = 140;
            
            // 1. Draw web grid lines (Levels 1 to 5)
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let level = 1; level <= 5; level++) {
                ctx.beginPath();
                const r = (maxRadius / 5) * level;
                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI / 3) - Math.PI / 2;
                    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
                }
                ctx.closePath();
                ctx.stroke();
            }

            // 2. Draw axis lines and typography labels
            ctx.strokeStyle = '#000000';
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textAlign = 'center';
            
            dimensions.forEach((dim, i) => {
                const angle = (i * Math.PI / 3) - Math.PI / 2;
                
                // Axis line
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + maxRadius * Math.cos(angle), cy + maxRadius * Math.sin(angle));
                ctx.stroke();
                
                // Text positioning offset adjustments
                const textDist = maxRadius + 20;
                let tx = cx + textDist * Math.cos(angle);
                let ty = cy + textDist * Math.sin(angle);
                if (i === 0) ty -= 5;
                if (i === 3) ty += 12;
                
                ctx.fillText(dim.label.toUpperCase(), tx, ty);
            });

            // 3. Read input scores, calculate index, identify primary bottleneck
            let totalScore = 0;
            let lowestScore = 6;
            let lowestDim = '';
            const currentPoints = [];

            dimensions.forEach((dim, i) => {
                const val = parseFloat(document.getElementById(dim.id).value);
                document.getElementById(`score-${dim.id}`).innerText = val.toFixed(1);
                
                totalScore += val;
                if (val < lowestScore) {
                    lowestScore = val;
                    lowestDim = dim.label;
                }

                const angle = (i * Math.PI / 3) - Math.PI / 2;
                const currentRadius = (maxRadius / 5) * val;
                currentPoints.push({
                    x: cx + currentRadius * Math.cos(angle),
                    y: cy + currentRadius * Math.sin(angle)
                });
            });

            // 4. Plot profile polygon
            ctx.beginPath();
            currentPoints.forEach((pt, i) => {
                if (i === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.stroke();

            // 5. Update summary elements
            const finalIndex = (totalScore / 6).toFixed(1);
            document.getElementById('indexValue').innerText = finalIndex;
            
            document.getElementById('bottleneckOutput').innerHTML = 
                `Primary systemic bottleneck identified within <span class="bottleneck-highlight">${lowestDim}</span> (${lowestScore.toFixed(1)}). Structural interventions should prioritize this axis to unlock maturity scaling.`;
        }

        dimensions.forEach(dim => {
            document.getElementById(dim.id).addEventListener('input', render);
        });

        render();
    </script>
</body>
</html>
